name: Ideon Technologies
description: 'Ideon Technologies (ideon.ai) develops REVEAL, a subsurface intelligence platform that
  uses muon tomography and geophysical inversion to image, map, and monitor mineral deposits and
  geological structures deep underground. It helps mining companies reduce geologic uncertainty across
  exploration, resource evaluation, geotechnical analysis, and cave monitoring, with customers including
  Rio Tinto, Vale, Glencore, and BHP. The company is backed by Playground Global. Ideon publishes a
  marketing and content web presence (solutions, case studies, papers, blog, careers) but no public
  developer API, SDK, or documentation surface; this profile tracks the company as a network lead.'
